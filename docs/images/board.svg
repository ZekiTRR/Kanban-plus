<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" fill="none">
  <defs>
    <filter id="laneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b1c20"/>
      <stop offset="1" stop-color="#141518"/>
    </linearGradient>
    <style>
      .t { font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .lane-title { font-size: 15px; font-weight: 700; fill: #f2f4f7; }
      .lane-count { font-size: 12px; font-weight: 600; fill: rgba(255,255,255,0.75); }
      .card-title { font-size: 13.5px; fill: #dfe3e8; }
      .tag { font-size: 11px; fill: #9fd0ff; }
      .meta { font-size: 11px; fill: #98a0aa; }
      .due { font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="679" rx="14" stroke="#2c2f36"/>

  <!-- ================= Lane: In progress ================= -->
  <g filter="url(#laneShadow)">
    <rect x="36" y="40" width="300" height="600" rx="9" fill="#23262c"/>
  </g>
  <rect x="36" y="40" width="300" height="46" rx="9" fill="#0079bf"/>
  <path d="M36 77h300v9H36z" fill="#0079bf"/>
  <text class="t lane-title" x="58" y="69">В работе</text>
  <text class="t lane-count" x="250" y="69">3</text>

  <!-- card 1 -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="102" width="272" height="92" rx="7" fill="#2c3038"/>
  </g>
  <rect x="50" y="102" width="272" height="92" rx="7" fill="none" stroke="#3a3f48"/>
  <rect x="50" y="102" width="4" height="92" rx="2" fill="#eb5a46"/>
  <text class="t card-title" x="68" y="128">Редизайн настроек доски</text>
  <rect x="68" y="140" width="64" height="19" rx="9.5" fill="#1d3a52"/>
  <text class="t tag" x="78" y="154">#design</text>
  <rect x="140" y="140" width="46" height="19" rx="9.5" fill="#3a1f2b"/>
  <text class="t tag" x="150" y="154">#ui</text>
  <rect x="68" y="169" width="178" height="4" rx="2" fill="#3a3f48"/>
  <rect x="68" y="169" width="106" height="4" rx="2" fill="#61bd4f"/>
  <text class="t meta" x="252" y="175">2/5</text>

  <!-- card 2 -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="204" width="272" height="78" rx="7" fill="#2c3038"/>
  </g>
  <rect x="50" y="204" width="272" height="78" rx="7" fill="none" stroke="#3a3f48"/>
  <text class="t card-title" x="68" y="230">Собрать фидбэк по [[Прототип]]</text>
  <rect x="68" y="244" width="112" height="22" rx="6" fill="#3a2f1a"/>
  <text class="t due" x="78" y="259" fill="#f2c94c">5 фев – 10 фев</text>

  <!-- card 3 -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="292" width="272" height="66" rx="7" fill="#2c3038"/>
  </g>
  <rect x="50" y="292" width="272" height="66" rx="7" fill="none" stroke="#3a3f48"/>
  <text class="t card-title" x="68" y="318">Проверить контраст цветов</text>
  <rect x="68" y="330" width="90" height="20" rx="6" fill="#40202a"/>
  <text class="t due" x="78" y="344" fill="#ff8a7a">просрочено</text>

  <!-- ================= Lane: Review ================= -->
  <g filter="url(#laneShadow)">
    <rect x="356" y="40" width="300" height="600" rx="9" fill="#23262c"/>
  </g>
  <rect x="356" y="40" width="300" height="46" rx="9" fill="#c377e0"/>
  <path d="M356 77h300v9H356z" fill="#c377e0"/>
  <text class="t lane-title" x="378" y="69">На проверке</text>
  <text class="t lane-count" x="570" y="69">2</text>

  <g filter="url(#cardShadow)">
    <rect x="370" y="102" width="272" height="74" rx="7" fill="#2c3038"/>
  </g>
  <rect x="370" y="102" width="272" height="74" rx="7" fill="none" stroke="#3a3f48"/>
  <text class="t card-title" x="388" y="128">Обновить документацию</text>
  <rect x="388" y="140" width="76" height="19" rx="9.5" fill="#1d3a52"/>
  <text class="t tag" x="398" y="154">#docs</text>

  <g filter="url(#cardShadow)">
    <rect x="370" y="186" width="272" height="74" rx="7" fill="#2c3038"/>
  </g>
  <rect x="370" y="186" width="272" height="74" rx="7" fill="none" stroke="#3a3f48"/>
  <rect x="370" y="186" width="4" height="74" rx="2" fill="#61bd4f"/>
  <text class="t card-title" x="388" y="212">Проверить сборку 2.1.0</text>
  <rect x="388" y="224" width="96" height="20" rx="6" fill="#173a2a"/>
  <text class="t due" x="398" y="238" fill="#7ee0a1">готово</text>

  <!-- ================= Lane: Done ================= -->
  <g filter="url(#laneShadow)">
    <rect x="676" y="40" width="300" height="600" rx="9" fill="#23262c"/>
  </g>
  <rect x="676" y="40" width="300" height="46" rx="9" fill="#61bd4f"/>
  <path d="M676 77h300v9H676z" fill="#61bd4f"/>
  <text class="t lane-title" x="698" y="69">Готово</text>
  <text class="t lane-count" x="902" y="69">1</text>

  <g filter="url(#cardShadow)">
    <rect x="690" y="102" width="272" height="66" rx="7" fill="#2c3038"/>
  </g>
  <rect x="690" y="102" width="272" height="66" rx="7" fill="none" stroke="#3a3f48"/>
  <text class="t card-title" x="708" y="128">Цветные списки и карточки</text>
  <text class="t meta" x="708" y="150">☑ 4/4 · #release</text>

  <!-- ================= Floating lane ================= -->
  <g filter="url(#laneShadow)">
    <rect x="880" y="372" width="284" height="248" rx="9" fill="#2a2d34"/>
  </g>
  <rect x="880" y="372" width="284" height="44" rx="9" fill="#ffab4a"/>
  <path d="M880 407h284v9H880z" fill="#ffab4a"/>
  <text class="t lane-title" x="900" y="400">Идеи</text>
  <g transform="translate(1112 382)">
    <rect width="30" height="26" rx="5" fill="rgba(0,0,0,0.22)"/>
    <path d="M15 5v8m0 0a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm-6 1h12" stroke="#1f2328" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="894" y="428" width="256" height="62" rx="7" fill="#33373f"/>
  </g>
  <text class="t card-title" x="910" y="452">Свободная колонка</text>
  <text class="t meta" x="910" y="472">перетащите за грип</text>

  <g filter="url(#cardShadow)">
    <rect x="894" y="500" width="256" height="56" rx="7" fill="#33373f"/>
  </g>
  <text class="t card-title" x="910" y="524">магнит вернёт в ряд</text>

  <!-- ================= Zoom controls ================= -->
  <g>
    <rect x="1010" y="640" width="154" height="30" rx="8" fill="#25282e" stroke="#3a3f48"/>
    <text class="t meta" x="1026" y="660">−</text>
    <text class="t meta" x="1064" y="660">120%</text>
    <text class="t meta" x="1136" y="660">+</text>
  </g>
</svg>
