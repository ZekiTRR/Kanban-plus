<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" fill="none">
  <defs>
    <linearGradient id="calBg" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b1c20"/>
      <stop offset="1" stop-color="#141518"/>
    </linearGradient>
    <style>
      .t { font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #eef1f5; }
      .nav { font-size: 13px; fill: #aab0b8; }
      .chip { font-size: 12px; fill: #c9ced6; }
      .wd { font-size: 11px; font-weight: 700; fill: #8b919a; letter-spacing: .04em; }
      .day { font-size: 12px; font-weight: 700; fill: #9aa0a8; }
      .dayToday { font-size: 12px; font-weight: 700; fill: #7aa7ff; }
      .card { font-size: 11.5px; fill: #dfe3e8; }
      .cardMuted { font-size: 11px; fill: #98a0aa; }
      .link { font-size: 11.5px; fill: #8ab4f8; }
      .period { font-size: 11px; font-weight: 600; fill: #26313f; }
      .hint { font-size: 12px; fill: #dfe3e8; }
      .hintMuted { font-size: 12px; fill: #9aa0a8; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="14" fill="url(#calBg)"/>
  <rect x="0.5" y="0.5" width="1199" height="679" rx="14" stroke="#2c2f36"/>

  <!-- header -->
