  <g transform="translate(196 22)">
    <rect width="28" height="26" rx="6" fill="#25282e" stroke="#3a3f48"/>
    <path d="M18 8l-7 5 7 5" stroke="#aab0b8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(230 22)">
    <rect width="56" height="26" rx="6" fill="#25282e" stroke="#3a3f48"/>
    <text class="t nav" x="14" y="18">Сегодня</text>
  </g>
  <g transform="translate(292 22)">
    <rect width="28" height="26" rx="6" fill="#25282e" stroke="#3a3f48"/>
    <path d="M10 8l7 5-7 5" stroke="#aab0b8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1008 22)">
